name: Destroy VPS Aruba

on:
  workflow_dispatch:
    inputs:
      stack:
        description: Nome stack Pulumi da distruggere
        required: true
        default: prod
        type: string
      confirm:
        description: Riscrivi il nome dello stack per confermare
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vps-${{ inputs.stack }}
  cancel-in-progress: false

env:
  PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
  ARUBACLOUD_CLIENT_ID: ${{ secrets.ARUBACLOUD_CLIENT_ID }}
  ARUBACLOUD_CLIENT_SECRET: ${{ secrets.ARUBACLOUD_CLIENT_SECRET }}

jobs:
  destroy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check confirmation
        env:
          STACK: ${{ inputs.stack }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          [[ "$STACK" == "$CONFIRM" ]] || { echo "::error::Conferma diversa dal nome dello stack"; exit 1; }
          [[ "$STACK" =~ ^[A-Za-z0-9._-]{1,40}$ ]] || { echo "::error::Nome stack non valido"; exit 1; }

      - uses: actions/checkout@v4

      - uses: ./.github/actions/pulumi-setup
        with:
          stack: ${{ inputs.stack }}

      - name: Pulumi destroy
        working-directory: infra
        run: pulumi destroy --yes --skip-preview
